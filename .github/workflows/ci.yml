name: Express API CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify syntax
        run: node --check server.js

      - name: Start server and test GET /products
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl --fail http://localhost:5000/products
          kill $SERVER_PID
